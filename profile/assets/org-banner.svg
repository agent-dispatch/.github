  <path d="M 0 0 H 1500 V 118 C 1250 98 1086 128 890 205 C 646 302 420 280 210 180 C 104 130 35 114 0 110 Z" fill="#E24B2D" opacity="0.07"/>
  <path d="M 1500 400 H 0 V 296 C 204 326 362 294 548 226 C 782 140 1032 166 1246 268 C 1360 322 1442 342 1500 338 Z" fill="#087F7A" opacity="0.06"/>

  <g transform="translate(130 200)" filter="url(#shadow)">
    <rect x="-56" y="-88" width="360" height="176" rx="18" fill="#FFFFFF" stroke="#16181D" stroke-opacity="0.1"/>
    <line x1="-4" y1="0" x2="76" y2="0" stroke="#16181D" stroke-opacity="0.24" stroke-width="4" stroke-linecap="round"/>
    <path d="M 76 0 C 118 0 126 -58 168 -58 H 206" fill="none" stroke="url(#accentA)" stroke-width="7" stroke-linecap="round"/>
    <line x1="76" y1="0" x2="238" y2="0" stroke="url(#accentB)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 76 0 C 118 0 126 58 168 58 H 206" fill="none" stroke="#5B55D6" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-4" cy="0" r="27" fill="#F6F7FB" stroke="#16181D" stroke-opacity="0.2" stroke-width="4"/>
    <circle cx="-4" cy="0" r="8" fill="#16181D"/>
    <circle cx="76" cy="0" r="7" fill="#E24B2D"/>
    <circle cx="206" cy="-58" r="21" fill="#FFFFFF" stroke="#E24B2D" stroke-width="5"/>
    <circle cx="206" cy="-58" r="7" fill="#E24B2D"/>
    <circle cx="238" cy="0" r="21" fill="#FFFFFF" stroke="#087F7A" stroke-width="5"/>
    <circle cx="238" cy="0" r="7" fill="#087F7A"/>
    <circle cx="206" cy="58" r="21" fill="#FFFFFF" stroke="#5B55D6" stroke-width="5"/>
    <circle cx="206" cy="58" r="7" fill="#5B55D6"/>
  </g>

  <g transform="translate(540 156)">
    <text x="0" y="0" fill="#9F2F20" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="850">PROVIDER-NEUTRAL MCP CONTROL PLANE</text>
    <text x="0" y="82" fill="#16181D" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="78" font-weight="850">AgentDispatch</text>
    <text x="0" y="136" fill="#626B7A" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="520">Spawn cloud subagents from any MCP-capable lead agent.</text>
