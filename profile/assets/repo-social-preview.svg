    <text x="0" y="110" fill="#16181D" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="82" font-weight="850">AgentDispatch</text>
    <text x="0" y="176" fill="#626B7A" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="520">Spawn durable cloud subagents from any</text>
    <text x="0" y="224" fill="#626B7A" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="520">MCP-capable lead agent.</text>

    <g transform="translate(0 296)">
      <rect x="0" y="0" width="178" height="42" rx="8" fill="#16181D"/>
      <text x="89" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">spawn_cloud_agent</text>
      <rect x="196" y="0" width="128" height="42" rx="8" fill="#FFFFFF" stroke="#16181D" stroke-opacity="0.16"/>
      <text x="260" y="27" text-anchor="middle" fill="#16181D" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="780">task_id</text>
      <rect x="342" y="0" width="176" height="42" rx="8" fill="#FFFFFF" stroke="#16181D" stroke-opacity="0.16"/>
      <text x="430" y="27" text-anchor="middle" fill="#16181D" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="780">A2A / MCP / HTTP</text>
