    <g transform="translate(72 154)">
      <line x1="-80" y1="0" x2="0" y2="0" stroke="#16181D" stroke-opacity="0.26" stroke-width="4" stroke-linecap="round"/>
      <path d="M 0 0 C 62 0 70 -92 132 -92 H 170" fill="none" stroke="url(#accentA)" stroke-width="7" stroke-linecap="round"/>
