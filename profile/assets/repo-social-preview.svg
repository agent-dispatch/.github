      <circle cx="0" cy="0" r="8" fill="#E24B2D"/>
      <circle cx="170" cy="-92" r="25" fill="#FFFFFF" stroke="#E24B2D" stroke-width="5"/>
      <circle cx="170" cy="-92" r="8" fill="#E24B2D"/>
      <circle cx="210" cy="0" r="25" fill="#FFFFFF" stroke="#087F7A" stroke-width="5"/>
      <circle cx="210" cy="0" r="8" fill="#087F7A"/>
      <circle cx="170" cy="92" r="25" fill="#FFFFFF" stroke="#5B55D6" stroke-width="5"/>
      <circle cx="170" cy="92" r="8" fill="#5B55D6"/>
    </g>
    <g transform="translate(36 36)">
      <rect x="0" y="0" width="76" height="28" rx="14" fill="#F0F3F8"/>
      <text x="38" y="19" text-anchor="middle" fill="#626B7A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800">Lead</text>
      <rect x="236" y="0" width="96" height="28" rx="14" fill="#F0F3F8"/>
      <text x="284" y="19" text-anchor="middle" fill="#626B7A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800">Cloud</text>
