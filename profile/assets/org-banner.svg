<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 400" width="1500" height="400">
  <defs>
    <linearGradient id="gradTop" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="-100">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="gradMid" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="140" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gradBot" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="100">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <radialGradient id="bgGlow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
    </radialGradient>
    
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <linearGradient id="gridFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1500" height="400" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="1500" height="400" fill="#0D1117"/>
  <rect width="1500" height="400" fill="url(#bgGlow)"/>
  <rect width="1500" height="400" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- Logo Group -->
  <g transform="translate(300, 200) scale(1.3)">
    <line x1="-110" y1="0" x2="0" y2="0" stroke="#7C3AED" stroke-width="8" stroke-linecap="round"/>
    
    <path d="M 0,0 C 50,0 50,-100 100,-100 L 120,-100" fill="none" stroke="url(#gradTop)" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="140" y2="0" stroke="url(#gradMid)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 0,0 C 50,0 50,100 100,100 L 120,100" fill="none" stroke="url(#gradBot)" stroke-width="8" stroke-linecap="round"/>

    <circle cx="0" cy="0" r="6" fill="#7C3AED"/>

    <circle cx="-55" cy="0" r="4" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="50" cy="-50" r="4" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="70" cy="0" r="4" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="50" cy="50" r="4" fill="#FFFFFF" filter="url(#glow)"/>

    <circle cx="-110" cy="0" r="28" fill="#0D1117" stroke="#7C3AED" stroke-width="6"/>
    <circle cx="-110" cy="0" r="10" fill="#7C3AED"/>

    <circle cx="120" cy="-100" r="20" fill="#0D1117" stroke="#FF9900" stroke-width="5"/>
    <circle cx="120" cy="-100" r="8" fill="#FF9900"/>

    <circle cx="140" cy="0" r="20" fill="#0D1117" stroke="#06B6D4" stroke-width="5"/>
    <circle cx="140" cy="0" r="8" fill="#06B6D4"/>

    <circle cx="120" cy="100" r="20" fill="#0D1117" stroke="#EC4899" stroke-width="5"/>
    <circle cx="120" cy="100" r="8" fill="#EC4899"/>
  </g>

  <!-- Typography -->
  <g transform="translate(600, 190)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="80" fill="#FFFFFF" letter-spacing="-1.5">
      Agent<tspan fill="url(#textGrad)">Dispatch</tspan>
    </text>
    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="32" fill="#8B949E" letter-spacing="-0.5">
      Spawn cloud subagents from any MCP-capable lead agent.
    </text>
  </g>
</svg>