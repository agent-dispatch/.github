<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#F6F7FB"/>
      <stop offset="100%" stop-color="#EDF1F7"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E24B2D"/>
      <stop offset="100%" stop-color="#9F2F20"/>
    </linearGradient>
    <linearGradient id="accentB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#087F7A"/>
      <stop offset="100%" stop-color="#5B55D6"/>
    </linearGradient>
    <linearGradient id="softTint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E24B2D" stop-opacity="0.16"/>
      <stop offset="52%" stop-color="#087F7A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#5B55D6" stop-opacity="0.13"/>
    </linearGradient>
    <pattern id="grid" width="88" height="88" patternUnits="userSpaceOnUse">
      <path d="M 88 0 L 0 0 0 88" fill="none" stroke="#16181D" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#272D39" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#paper)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <path d="M 0 0 H 1280 V 180 C 1060 126 900 136 766 206 C 589 298 402 260 230 174 C 132 125 56 101 0 96 Z" fill="url(#softTint)"/>
  <path d="M 0 640 H 1280 V 504 C 1090 540 940 520 796 455 C 610 371 414 398 248 487 C 134 548 52 568 0 566 Z" fill="#FFFFFF" opacity="0.62"/>

  <g transform="translate(92 112)">
